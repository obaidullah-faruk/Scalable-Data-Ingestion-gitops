apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingestion-dev
resources:
  - ../../base
  # Sealed for ingestion-dev. They don't decrypt in any other namespace.
  - secrets/postgres.yaml
  - secrets/rabbitmq.yaml
  - secrets/s3-credentials.yaml
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - S3_UPLOAD_BUCKET=ingestion-dev-uploads
      - REACT_ORIGIN=http://dev.ingest.lab
patches:
  - target:
      kind: HTTPRoute
      name: ingestion
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - dev.ingest.lab
# Set by the release workflow on every merge to main. The digest is what runs; the tag is the commit.
images:
  - name: docker.io/faruk75/ingestion-backend
    newTag: 70e714ce965935ad2f03b5934655564ef561911b
    digest: sha256:3edff8faa89b4429aef3ea261ea21577f1de534e23dd8c2c152285e7415ec4b7
  - name: docker.io/faruk75/ingestion-frontend
    newTag: 70e714ce965935ad2f03b5934655564ef561911b
    digest: sha256:59c2e17a63f6d723500e8c48d50f1f5e77a8e49e9a86e6006269b83ebde2da26
