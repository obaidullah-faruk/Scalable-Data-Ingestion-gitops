# Publishes queued tasks that never reached RabbitMQ, for example after an api pod stopped
# between saving a task and publishing it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile
  labels:
    app.kubernetes.io/name: reconcile
    app.kubernetes.io/component: reconcile
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  # Skip a run that couldn't start within 2 minutes; the next one is 5 minutes away.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reconcile
            app.kubernetes.io/component: reconcile
        spec:
          restartPolicy: Never
          nodeSelector:
            app: "true"
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: docker.io/faruk75/ingestion-backend
              command: ["python", "-m", "app.scripts.reconcile_queued_tasks"]
              envFrom:
                - configMapRef:
                    name: backend-config
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: password
                - name: RABBITMQ_USER
                  valueFrom:
                    secretKeyRef:
                      name: rabbitmq
                      key: username
                - name: RABBITMQ_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rabbitmq
                      key: password
                - name: CELERY_BROKER_URL
                  value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672//
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
