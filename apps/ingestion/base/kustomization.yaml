apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: ingestion
resources:
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - rabbitmq/statefulset.yaml
  - rabbitmq/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - jobs/s3-init.yaml
  - jobs/migrate.yaml
  - api/deployment.yaml
  - api/service.yaml
  - worker/deployment.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - reconcile/cronjob.yaml
  - routes/httproute.yaml
# Settings shared by every backend process. The hash suffix makes pods restart when they change.
configMapGenerator:
  - name: backend-config
    literals:
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ingestion
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://floci.object-storage.svc.cluster.local:4566
      - S3_BROWSER_ENDPOINT_URL=http://s3.ingest.lab
      - AWS_DEFAULT_REGION=us-east-1
