# Each overlay adds its hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingestion
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
  rules:
    # Server-sent events stay open while a run is processed. Envoy's default request
    # timeout would cut them off after 15 s.
    - matches:
        - path:
            type: RegularExpression
            value: ^/api/v1/ingestion-runs/[^/]+/events$
      timeouts:
        request: 1h
      backendRefs:
        - name: api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8000
    - backendRefs:
        - name: frontend
          port: 8080
