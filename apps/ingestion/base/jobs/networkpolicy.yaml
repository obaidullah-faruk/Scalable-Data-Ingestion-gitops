# Creates the bucket in S3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3-init
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: s3-init
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: object-storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: floci
      ports:
        - port: 4566
---
# Migrates the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
