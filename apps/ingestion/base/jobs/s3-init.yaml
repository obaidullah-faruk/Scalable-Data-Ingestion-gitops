# Creates the upload bucket and sets its CORS policy. Runs on every sync, after the data
# services are healthy (wave 0) and before the app (wave 2). Safe to rerun.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-init
  labels:
    app.kubernetes.io/name: s3-init
    app.kubernetes.io/component: setup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # Keeps the last run for its logs until the next sync replaces it.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-init
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      nodeSelector:
        app: "true"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3-init
          image: docker.io/faruk75/ingestion-backend
          command: ["python", "-m", "app.scripts.init_s3"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
