# Ubuntu's package, 2.x from noble-updates. kubelet 1.38 and later no longer work with containerd 1.x.
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

# The package ships no config file and no config directory.
- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write containerd config
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Start containerd on boot
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
