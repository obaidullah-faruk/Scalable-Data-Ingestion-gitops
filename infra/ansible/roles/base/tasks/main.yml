- name: Write /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Set timezone to UTC
  community.general.timezone:
    name: Etc/UTC

- name: Keep the clock in sync
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started

# Upgrades run from upgrade-os.yml, so reruns of this role stay at changed=0.
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
