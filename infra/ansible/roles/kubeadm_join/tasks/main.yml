- name: Check if the node has joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubeadm_join_kubelet_conf

- name: Join the cluster
  when: not kubeadm_join_kubelet_conf.stat.exists
  block:
    # Prints the full join command, including the CA cert hash. The template reads both from it.
    - name: Create a bootstrap token
      ansible.builtin.command: kubeadm token create --ttl 15m --print-join-command
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: kubeadm_join_command
      changed_when: true

    - name: Write kubeadm join config
      ansible.builtin.template:
        src: kubeadm-join.yaml.j2
        dest: /etc/kubernetes/kubeadm-join.yaml
        owner: root
        group: root
        mode: "0600"
        validate: kubeadm config validate --config %s
      # Keeps the token out of --diff output.
      diff: false

    - name: Join the node
      ansible.builtin.command: kubeadm join --config /etc/kubernetes/kubeadm-join.yaml
      changed_when: true
