- name: Write kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0644"
    validate: kubeadm config validate --config %s

# Runs once. Config changes after init go through kubeadm upgrade, not a second init.
- name: Initialize the cluster
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: /etc/kubernetes/admin.conf

# Full admin access. Never in Git; phase 7 replaces it with personal certificates.
- name: Copy the admin kubeconfig to the Mac
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeadm_init_mac_kubeconfig }}"
    flat: true

- name: Restrict the admin kubeconfig on the Mac
  ansible.builtin.file:
    path: "{{ kubeadm_init_mac_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false
