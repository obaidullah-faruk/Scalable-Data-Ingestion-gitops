# kubelet refuses to start while swap is on.
- name: Turn off swap
  ansible.builtin.command: swapoff --all
  when: ansible_facts.swaptotal_mb > 0
  changed_when: true

- name: Keep swap off after reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]+\s+\S+\s+swap\s.*)$'
    replace: '# \1'

# Nodes route pod traffic between interfaces. kubeadm preflight requires it.
- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    sysctl_set: true
