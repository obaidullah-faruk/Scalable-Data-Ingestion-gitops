# Hostnames resolve through /etc/hosts. SSH user and key come from ~/.ssh/config.
all:
  children:
    control_plane:
      hosts:
        cp-1:
    workers:
      hosts:
        # Runs every workload with a PVC.
        worker-1:
          node_labels:
            data: "true"
          node_taints:
            - key: dedicated
              value: data
              effect: NoSchedule
        # Runs stateless apps.
        worker-2:
          node_labels:
            app: "true"
