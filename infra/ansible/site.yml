- name: Prepare Kubernetes nodes
  hosts: all
  become: true
  roles:
    - base
    - kernel
    - containerd
    - kubernetes_packages

- name: Set up the control plane
  hosts: control_plane
  become: true
  roles:
    - kubeadm_init
    - helm
    - calico

- name: Join the workers
  hosts: workers
  become: true
  roles:
    - kubeadm_join
