- name: Prepare Kubernetes nodes
  hosts: all
  become: true
  roles:
    - base
    - kernel
    - containerd
    - kubernetes_packages

- name: Set up the control plane
  hosts: control_plane
  become: true
  roles:
    - kubeadm_init
    - helm
    - calico

- name: Join the workers
  hosts: workers
  become: true
  roles:
    - kubeadm_join

- name: Approve kubelet serving certificates
  hosts: all
  become: true
  roles:
    - kubelet_serving_cert

# After the join: the control plane and worker-1 are tainted, so ArgoCD runs on worker-2.
- name: Bootstrap ArgoCD
  hosts: control_plane
  become: true
  roles:
    - argocd
