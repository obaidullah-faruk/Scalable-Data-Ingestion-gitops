apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons
  sourceRepos:
    - https://github.com/obaidullah-faruk/Scalable-Data-Ingestion-gitops.git
    - ghcr.io/rancher/local-path-provisioner/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  # Add-ons install CRDs, ClusterRoles, webhooks and Namespaces.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
