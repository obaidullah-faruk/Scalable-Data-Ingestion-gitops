# Top of the Multipass network. The Mac's DHCP server leases VM addresses from the bottom.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb-system
  annotations:
    # Applied once the chart's controller is ready to serve the validating webhook.
    argocd.argoproj.io/sync-wave: "1"
spec:
  addresses:
    - 192.168.252.240-192.168.252.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ipAddressPools:
    - default
