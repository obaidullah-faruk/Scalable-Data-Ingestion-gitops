apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  # Deleting the Application also deletes what it installed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    # OCI chart. Argo CD expects the registry path without the oci:// prefix.
    - repoURL: ghcr.io/rancher/local-path-provisioner/charts
      chart: local-path-provisioner
      targetRevision: 0.0.37
      helm:
        valueFiles:
          - $values/platform/local-path-provisioner/values.yaml
    - repoURL: https://github.com/obaidullah-faruk/Scalable-Data-Ingestion-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
