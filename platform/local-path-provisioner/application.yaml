apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  # Deleting the Application also deletes what it installed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    # The chart isn't published to a Helm repository, so it is read from the release tag.
    - repoURL: https://github.com/rancher/local-path-provisioner.git
      targetRevision: v0.0.37
      path: deploy/chart/local-path-provisioner
      helm:
        valueFiles:
          - $values/platform/local-path-provisioner/values.yaml
    - repoURL: https://github.com/obaidullah-faruk/Scalable-Data-Ingestion-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
