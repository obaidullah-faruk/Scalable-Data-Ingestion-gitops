# Values for the loki chart. The chart version is pinned in application.yaml.

# One pod that runs every Loki component, storing chunks and index on its own volume.
deploymentMode: SingleBinary

loki:
  # One tenant. Clients send no X-Scope-OrgID header.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 7d
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  # worker-1 holds every PVC.
  nodeSelector:
    data: "true"
  tolerations:
    - key: dedicated
      value: data
      effect: NoSchedule
  persistence:
    # Like every data volume in the cluster, the PVC outlives the StatefulSet.
    enableStatefulSetAutoDeletePVC: false
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Only used by the scalable deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Not needed for a single small instance: Grafana and Fluent Bit talk to the Loki service directly.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
# Loads Loki alert rules from ConfigMaps. Alerts come from Prometheus instead.
sidecar:
  rules:
    enabled: false
