# Gateway API and Envoy Gateway CRDs, kept apart from the controller so other apps' routes
# don't depend on its lifecycle. No resources finalizer: deleting this Application must not
# delete the CRDs, which would delete every Gateway and route in the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-crds
  namespace: argocd
spec:
  project: platform
  sources:
    # Same version as the envoy-gateway chart.
    - repoURL: docker.io/envoyproxy
      chart: gateway-crds-helm
      targetRevision: v1.9.2
      helm:
        valueFiles:
          - $values/platform/envoy-gateway-crds/values.yaml
    - repoURL: https://github.com/obaidullah-faruk/Scalable-Data-Ingestion-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CRDs are too large for the last-applied annotation of a client-side apply.
      - ServerSideApply=true
