apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
  hostnames:
    - grafana.lab
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
