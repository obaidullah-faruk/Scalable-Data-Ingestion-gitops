apiVersion: v1
kind: Namespace
metadata:
  name: object-storage
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: object-storage
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "5"
    persistentvolumeclaims: "2"
    requests.storage: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: object-storage
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
