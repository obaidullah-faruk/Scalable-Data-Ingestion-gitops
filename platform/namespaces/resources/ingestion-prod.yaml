apiVersion: v1
kind: Namespace
metadata:
  name: ingestion-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: ingestion-prod
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.cpu: "12"
    limits.memory: 12Gi
    pods: "30"
    persistentvolumeclaims: "4"
    requests.storage: 20Gi
---
# Requests and limits for containers that don't set their own.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ingestion-prod
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
---
# No traffic in or out of any pod unless another policy allows it. Each workload brings its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ingestion-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: ingestion-prod
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
