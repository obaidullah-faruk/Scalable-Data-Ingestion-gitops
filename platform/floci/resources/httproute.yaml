# Browsers upload parts straight to S3 with presigned URLs, so Floci needs a public name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: floci
  namespace: object-storage
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
  hostnames:
    - s3.ingest.lab
  rules:
    - backendRefs:
        - name: floci
          port: 4566
