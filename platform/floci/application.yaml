# Floci, an S3-compatible store, and its route for browsers at s3.ingest.lab.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: floci
  namespace: argocd
  # Deleting the Application also deletes what it installed. The PVC is not in Git, so it stays.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/obaidullah-faruk/Scalable-Data-Ingestion-gitops.git
    targetRevision: main
    path: platform/floci/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: object-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
